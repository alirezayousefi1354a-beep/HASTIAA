<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سبد خرید | HASTIA</title>

<style>

body{
    margin:0;
    padding:30px 15px;
    background:#f8f5f0;
    font-family:Arial,sans-serif;
    color:#222;
}

.cart{
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
}

h1{
    text-align:center;
}

.item{
    padding:18px 0;
    border-bottom:1px solid #eee;
}

.name{
    font-weight:bold;
    font-size:18px;
}

.price,
.count{
    margin-top:8px;
    color:#666;
}

.total{
    text-align:center;
    font-weight:bold;
    font-size:20px;
    margin:25px 0;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.clear{
    background:#777;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#555;
    text-decoration:none;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

</style>
</head>

<body>

<div class="cart">

<h1>🛒 سبد خرید HASTIA</h1>

<div id="items"></div>

<div id="total" class="total"></div>

<button onclick="checkout()">
تسویه حساب
</button>

<button class="clear" onclick="clearCart()">
پاک کردن سبد خرید
</button>

<a class="back" href="index.html">
← بازگشت به فروشگاه
</a>

</div>


<script>

/* گرفتن اطلاعات ذخیره شده */

let cart =
    JSON.parse(localStorage.getItem("hastiaCart")) || [];


/* گرفتن محصولی که از طریق لینک فرستاده شده */

let params =
    new URLSearchParams(window.location.search);

let name =
    params.get("name");

let price =
    Number(params.get("price"));


/* اگر محصول از Product وارد شده بود */

if(name && price){

    cart.push({
        name: name,
        price: price
    });

    localStorage.setItem(
        "hastiaCart",
        JSON.stringify(cart)
    );

}


/* نمایش سبد خرید */

function showCart(){

    let cart =
        JSON.parse(localStorage.getItem("hastiaCart")) || [];

    let items =
        document.getElementById("items");

    let total =
        document.getElementById("total");

    items.innerHTML = "";

    if(cart.length === 0){

        items.innerHTML =
        '<div class="empty">سبد خرید شما خالی است.</div>';

        total.innerHTML = "";

        return;
    }

    let sum = 0;

    cart.forEach(function(item){

        let itemPrice =
            Number(item.price) || 0;

        sum += itemPrice;

        items.innerHTML +=

        '<div class="item">' +

            '<div class="name">' +
            (item.name || "محصول HASTIA") +
            '</div>' +

            '<div class="price">' +
            'قیمت: ' +
            itemPrice.toLocaleString() +
            ' تومان' +
            '</div>' +

            '<div class="count">' +
            'تعداد: 1' +
            '</div>' +

        '</div>';

    });

    total.innerHTML =
        "مجموع: " +
        sum.toLocaleString() +
        " تومان";
}


/* پاک کردن سبد */

function clearCart(){

    localStorage.removeItem("hastiaCart");

    showCart();
}


/* تسویه حساب */

function checkout(){

    let cart =
        JSON.parse(localStorage.getItem("hastiaCart")) || [];

    if(cart.length === 0){

        alert("سبد خرید شما خالی است.");

        return;
    }

    window.location.href =
        "checkout.html";
}


showCart();

</script>

</body>

</html>
