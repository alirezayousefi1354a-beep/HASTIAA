<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>گردنبند ستاره ساحلی | HASTIA</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background: #f8f5f0;
            color: #2f2f2f;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .product-page {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .back {
            display: block;
            margin-bottom: 25px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
        }

        .product {
            width: 100%;
        }

        .product-image {
            width: 100%;
            text-align: center;
        }

        .product-image img {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            display: block;
            margin: auto;
        }

        .product-info {
            width: 100%;
        }

        .brand {
            font-size: 14px;
            letter-spacing: 3px;
            color: #888;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 25px;
            margin: 0 0 20px;
        }

        .description {
            color: #666;
            line-height: 2;
            font-size: 15px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 25px 0;
        }

        .add-cart {
            background: #2f2f2f;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }

    </style>

</head>


<body>

    <div class="product-page">

        <a class="back" href="index.html">
            ← بازگشت به فروشگاه
        </a>


        <div class="product">

            <div class="product-image">

               <img
    src="produc10.png"
    alt="گردنبند ستاره ساحلی"
>
                

            </div>


            <div class="product-info">

                <div class="brand">
                    HASTIA
                </div>


                <h1>
                    گردنبند ستاره ساحلی
                </h1>


                <p class="description">
                    گردنبند ستاره ساحلی، ظریف و مینیمال؛
                    انتخابی مناسب برای استایل‌های ساده و شیک HASTIA.
                </p>


                <div class="price">
                    400000 تومان
                </div>


               <button id="addButton">
    افزودن به سبد خرید 🛒
</button>

            </div>

        </div>

    </div>


<script>
document.getElementById("addButton").onclick = function () {

    window.location.href =
        "cart.html?name=" +
        encodeURIComponent("گردنبند ساحلی") +
        "&price=400000";

};
</script>

</body>

</html>
