<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نحوه نگهداری | HASTIA</title>

    <style>
        body {
            margin: 0;
            padding: 30px 15px;
            background: #f8f5f0;
            color: #2f2f2f;
            font-family: Arial, sans-serif;
        }

        .care {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 35px 25px;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        h1 {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 30px;
            margin-bottom: 30px;
        }

        .item {
            padding: 18px 0;
            border-bottom: 1px solid #eee;
            line-height: 2;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item strong {
            display: block;
            font-size: 17px;
            margin-bottom: 5px;
        }

        .item p {
            margin: 0;
            color: #666;
            font-size: 15px;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 25px;
            background: #2f2f2f;
            color: white;
            border-radius: 25px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="care">

    <h1>نحوه نگهداری HASTIA 🤍</h1>

    <div class="item">
        <strong>💧 دور از آب نگه دارید</strong>
        <p>
            برای ماندگاری بیشتر، هنگام حمام، استخر و شست‌وشو
            اکسسوری را دربیاورید.
        </p>
    </div>

    <div class="item">
        <strong>🌸 عطر و کرم</strong>
        <p>
            عطر، اسپری، کرم و مواد آرایشی را مستقیماً روی اکسسوری نزنید.
        </p>
    </div>

    <div class="item">
        <strong>☀️ دور از رطوبت و گرما</strong>
        <p>
            اکسسوری‌ها را در جای خشک و دور از نور مستقیم خورشید نگهداری کنید.
        </p>
    </div>
