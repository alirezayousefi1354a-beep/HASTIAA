<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>دستبند منحنی ترند | HASTIA</title>

    <style>
        body {
            background-color: #f8f5f0;
            color: #2f2f2f;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        nav {
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 40px;
        }

        nav a {
            color: #2f2f2f;
            text-decoration: none;
            margin: 0 12px;
            font-size: 14px;
        }

        .product {
            background-color: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .product img {
            width: 100%;
            max-width: 350px;
            height: 350px;
            object-fit: contain;
            border-radius: 15px;
        }

        h1 {
            font-size: 28px;
            margin-top: 25px;
        }

        .description {
            font-size: 15px;
            line-height: 2;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .buy-button {
            background-color: #2f2f2f;
            color: white;
            border: none;
            padding: 13px 35px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        .buy-button:hover {
            background-color: #555;
        }

        .back {
            display: block;
            margin-top: 25px;
            color: #2f2f2f;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">خانه</a>
        <a href="products.html">محصولات</a>
        <a href="cart.html">سبد خرید</a>
    </nav>

    <div class="product">

        <img src="product1.png" alt="دستبند منحنی ترند">

        <h1>دستبند منحنی ترند</h1>

        <p class="description">
            دستبند منحنی و ترند HASTIA،
            مناسب استایل‌های مینیمال، ساده و شیک.
        </p>

        <p class="price">
            ۴۵۰,۰۰۰ تومان
        </p>

        <button class="buy-button" onclick="addToCart(1)">
            افزودن به سبد خرید
        </button>

        <a class="back" href="index.html">
            بازگشت به صفحه اصلی
        </a>

    </div>


    <script>

         function addToCart() {
    window.location.href =
        "cart.html?name=دستبند%20منحنی%20ترند&price=450000";
}
    </script>

</body>

</html>
