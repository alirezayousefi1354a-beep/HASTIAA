<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>گردنبند مرواریدی | HASTIA</title>

    <style>
        body {
            background-color: #f8f5f0;
            color: #2f2f2f;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        .product {
            background-color: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .product img {
            width: 350px;
            height: 350px;
            object-fit: contain;
            border-radius: 15px;
        }

        h1 {
            font-size: 28px;
        }

        .description {
            font-size: 15px;
            line-height: 2;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 20px;
        }

        button {
            background-color: #2f2f2f;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #555;
        }

        a {
            color: #2f2f2f;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="product">

        <img src="product4.png" alt="گردنبند مرواریدی">

        <h1>گردنبند مرواریدی</h1>

        <p class="description">
            گردنبند مرواریدی ظریف و شیک،
            مناسب استایل‌های خاص و روزمره.
        </p>

        <p class="price">
            ۴۰۰,۰۰۰ تومان
        </p>

        <button id="addButton">
            افزودن به سبد خرید
        </button>

        <br><br>

        <a href="index.html">
            بازگشت به صفحه اصلی
        </a>

    </div>

   <script>
document.getElementById("addButton").onclick = function () {

    window.location.href =
        "cart.html?name=" +
        encodeURIComponent("گردنبند مرواریدی") +
        "&price=400000";

};
</script>

</body>

</html>
